name: Windows Local Verify Build

on:
  push:
    branches:
      - windows-local-verify-20260830
  workflow_dispatch:

jobs:
  build-windows-local-verify:
    name: Build Windows local verification artifact
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
      ITERATE_REQUIRE_ACTIVATION: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build mcp-server binary
        run: cargo build --release --bin mcp-server

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows startup fix contracts
        shell: pwsh
        run: |
          pnpm run lint:check
          cargo check --lib --bins
          pnpm run test:windows-experience
          pnpm run test:desktop-community-activation
          pnpm run test:speech-services

      - name: Build Windows binaries and NSIS installer
        run: pnpm exec tauri build --bundles nsis

      - name: Collect verification package
        shell: pwsh
        run: |
          $packageName = 'iterate-windows-local-verify'
          $packageDir = 'windows-package'
          $appDir = Join-Path $packageDir 'app'
          $webViewLoaderPath = node ./scripts/select-windows-x64-webview2-loader.mjs target

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($webViewLoaderPath)) {
            throw 'WebView2Loader.dll not found'
          }

          $installer = Get-ChildItem 'target\release\bundle\nsis\*-setup.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'NSIS installer was not produced'
          }

          New-Item -ItemType Directory -Path $appDir -Force | Out-Null
          Copy-Item 'target\release\iterate.exe' "$appDir\\"
          Copy-Item 'target\release\mcp-server.exe' "$appDir\\"
          Copy-Item -LiteralPath $webViewLoaderPath "$appDir\WebView2Loader.dll"
          Copy-Item -LiteralPath $installer.FullName -Destination "$packageName-setup.exe" -Force
          Compress-Archive -Path $packageDir -DestinationPath "$packageName.zip" -Force

      - name: Smoke verification package layout
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/windows-install-smoke.ps1 -PackageDir windows-package

      - name: Upload private verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iterate-windows-local-verify
          path: |
            iterate-windows-local-verify.zip
            iterate-windows-local-verify-setup.exe
          retention-days: 3
